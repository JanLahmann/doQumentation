body:
  - type: markdown
    attributes:
      value: |
        **One question per discussion — please start a new discussion for each question.**

        Found a problem instead? Use an issue form:
        [site bug](https://github.com/JanLahmann/doQumentation/issues/new?template=site-bug.yml) ·
        [wrong or awkward translation](https://github.com/JanLahmann/doQumentation/issues/new?template=translation-report.yml) ·
        [code cell does not run](https://github.com/JanLahmann/doQumentation/issues/new?template=execution-error.yml).
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: What you were doing, code you ran or settings you used, and what happened.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL (optional)
      description: The doQumentation page your question is about, if any.
      placeholder: https://doqumentation.org/...
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
