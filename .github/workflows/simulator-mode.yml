name: Simulator Mode

# Runs the "Get started" pages against the exact kernel patches the site
# injects (src/kernel/), in the QuBins image the site uses, in both Simulator
# Modes. The notebook sweep uses its own shim, so it missed #965 (CHSH crashed
# on the ideal AerSimulator) and #966 (Hello World saved placeholder
# credentials). Path-filtered: upstream syncs that change these pages trigger it.

on:
  pull_request:
    paths:
      - 'src/kernel/**'
      - 'src/components/ExecutableCode/**'
      - 'src/config/jupyter.ts'
      - 'scripts/check-simulator-mode.py'
      - 'docs/tutorials/chsh-inequality.mdx'
      - 'docs/tutorials/hello-world.mdx'
      - '.github/workflows/simulator-mode.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run pages in the site's QuBins image
        run: |
          tag=$(sed -n "s/^export const DEFAULT_QISKIT_TAG: QiskitTag = '\(.*\)';/\1/p" src/config/jupyter.ts)
          test -n "$tag" || { echo "DEFAULT_QISKIT_TAG not found in src/config/jupyter.ts"; exit 1; }
          echo "QuBins image: ghcr.io/qubins/images:$tag"
          docker run --rm --user root -v "$PWD:/repo" -w /repo \
            "ghcr.io/qubins/images:$tag" python scripts/check-simulator-mode.py
