name: CI

# PR-time correctness gate. Before this existed, nothing ran `tsc` or a build on
# pull requests — type errors and MDX/JSX build breaks only surfaced after merge
# (deploy.yml builds on push to main). This catches both on the PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # the translation-lint step lists the PR's changed files

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Pure-function unit tests for the translation pipeline (fast, no IO).
      - name: Python unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest translation/scripts/tests/

      # Fails loud if the Binder default Qiskit image tag drifts out of lockstep
      # with the qiskit[all] pin the CE/Docker image is built from (they drifted
      # once: Binder stayed on 2.3-xl after a bump to qiskit 2.4.1).
      - name: Qiskit lockstep check
        run: python3 scripts/check-qiskit-lockstep.py

      # Cheap and fast — would have caught the 4 long-standing tsc errors.
      - name: Type check
        run: npm run typecheck

      # MUST run BEFORE "Sync content": sync-content.py overwrites docs/ with
      # current upstream, and lint-translation.py compares each translation
      # against docs/. Running it after the sync therefore graded translations
      # against upstream's tip instead of the docs/ committed here — so a PR
      # failed for EN edits it did not make and could not reproduce locally.
      # That is what happened to ja/tutorials/fractional-gates.mdx: the lint
      # reported TR=104 vs EN=124 fences, while the repo's own docs/ copy has
      # 104 and the PR's diff was a one-character URL fix touching no fences.
      #
      # lint-translation.py had NO CI coverage at all, so its errors sat on main
      # unnoticed (a real code-fence mismatch in quantum-chem-with-vqe survived
      # that way). A full-corpus run is ~15 min, so scope it to the files the PR
      # actually touches — ~0.4s each. The daily check-translations.yml run
      # covers the whole corpus and catches drift this step cannot see.
      # Files come from the PR API rather than `git diff`, because checkout is
      # shallow here and a base..HEAD diff would need fetch-depth: 0.
      - name: Lint changed translations
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Paginated: `gh pr view --json files` stops at 100 files, so a
          # large PR would have most of its translations skipped here.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
             -q '.[].filename' > /tmp/pr-files.txt
          rc=0
          count=0
          while IFS= read -r f; do
            case "$f" in i18n/*.mdx) ;; *) continue ;; esac
            [ -f "$f" ] || continue   # deleted/renamed away
            count=$((count + 1))
            python3 translation/scripts/lint-translation.py --file "$f" || rc=1
          done < /tmp/pr-files.txt
          echo "linted $count changed translation file(s)"
          exit $rc

      # Sync content so the build has docs/ to compile, then build EN only.
      # The full 27-locale build OOMs locally; per-locale CI builds are sharded
      # in deploy-locales.yml. EN is the correctness-representative gate here.
      - name: Sync content
        run: python3 scripts/sync-content.py --no-clone

      - name: Build (EN)
        run: npm run build -- --locale en
        env:
          NODE_OPTIONS: --max-old-space-size=8192
