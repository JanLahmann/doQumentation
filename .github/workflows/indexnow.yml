name: IndexNow

# Tells Bing, Yandex & co. which pages changed (the Fun with Quantum family's
# shared job, family/indexnow/README.md in JanLahmann/Fun-with-Quantum).
#
# Weekly rather than after each deploy: a page's sitemap <lastmod> is the
# date its English source changed upstream (src/config/upstreamFileMeta.json),
# which lands here with the Monday upstream sync, days later. A per-deploy
# run with a short window would miss those pages, and a long one would resend
# them on every merge. Tuesday's run sends what changed in the last 14 days,
# on every locale host; the key file is static/<key>.txt, on every host.

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  indexnow:
    strategy:
      fail-fast: false
      matrix:
        host: ['', 'de.', 'es.', 'uk.', 'fr.', 'it.', 'pt.', 'ja.', 'tl.', 'ar.',
               'he.', 'ms.', 'id.', 'th.', 'ko.', 'pl.', 'ro.', 'cs.']
    uses: JanLahmann/Fun-with-Quantum/.github/workflows/indexnow.yml@master
    with:
      site: https://${{ matrix.host }}doqumentation.org
      key: e1e31bdfe4caf28f9f0f5b2afcef5ee5
      days: 14
