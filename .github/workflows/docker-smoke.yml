name: Docker Smoke Test

# The "Build and Push Docker Images" workflow only BUILDS the jupyter-local
# image — it can't catch runtime failures like the entrypoint's nginx `sed`
# needing a jovyan-writable /etc/nginx/sites-enabled (which exited the container
# with code 4 on first real run). This job actually RUNS the amd64 image and
# asserts it serves, so a startup regression is caught in CI on the PR — not on
# a user's machine. Path-filtered to the image's runtime-relevant inputs.
on:
  pull_request:
    paths:
      - 'Dockerfile.jupyter'
      - 'scripts/docker-entrypoint.sh'
      - 'nginx.conf'
      - 'binder/jupyter-requirements-security.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'docusaurus.config.ts'
      - 'static/vendor/**'
      - 'static/runtime-config.js'
      - '.github/workflows/docker-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.jupyter'
      - 'scripts/docker-entrypoint.sh'
      - 'nginx.conf'
      - 'binder/jupyter-requirements-security.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only (the runner is amd64 so we can `docker run` it). Reuses the
      # main build's gha cache for the expensive layers; only the tail (nginx
      # config, entrypoint) rebuilds when those change.
      - name: Build jupyter-local (amd64, load to daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.jupyter
          target: jupyter-local
          platforms: linux/amd64
          load: true
          tags: doqumentation-jupyter:smoke
          cache-from: |
            type=gha,scope=jupyter
            type=gha,scope=jupyter-amd64

      - name: Run container and verify it serves
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 \
            -e JUPYTER_TOKEN=smoketoken1234 doqumentation-jupyter:smoke

          ok=0
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ok=1; break; fi
            # Bail early if the container already exited (e.g. entrypoint crash).
            if [ -z "$(docker ps -q --filter name=smoke)" ]; then
              echo "::error::container exited during startup"; break
            fi
            sleep 2
          done

          echo "----- container logs -----"
          docker logs smoke || true
          echo "--------------------------"

          if [ "$ok" != "1" ]; then
            echo "::error::jupyter-local did not serve the site on :8080"
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi

          # The entrypoint's nginx sed must have succeeded (this is the exact
          # bug guarded against): the token is injected into the proxy config.
          docker exec smoke grep -q \
            'proxy_set_header Authorization "token smoketoken1234"' \
            /etc/nginx/sites-enabled/default
          echo "PASS: container serves and the entrypoint completed (nginx sed ok)"

          # The proxy adds the token, which makes Jupyter skip its own Origin
          # check, so nginx must refuse cross-site and DNS-rebinding requests
          # while any same-origin LAN address (a classroom Pi) gets through.
          ready=0
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            docker logs smoke || true
            echo "::error::Jupyter did not answer through the proxy"
            docker rm -f smoke >/dev/null 2>&1 || true
            exit 1
          fi

          fail=0
          expect() {  # expect <code> <path> <description> <curl args...>
            want="$1"; path="$2"; desc="$3"; shift 3
            got=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080$path" \
              -H 'Content-Type: application/json' -d '{"type":"notebook"}' "$@")
            if [ "$got" = "$want" ]; then echo "PASS: $desc ($got)"; else echo "::error::$desc: got $got, want $want"; fail=1; fi
          }
          expect 201 /api/contents  "same-origin localhost"      -H 'Host: localhost:8080'       -H 'Origin: http://localhost:8080'
          expect 201 /api/contents  "same-origin LAN IP"         -H 'Host: 192.168.1.23:8080'    -H 'Origin: http://192.168.1.23:8080'
          expect 201 /api/contents  "same-origin .local name"    -H 'Host: rasqberry.local:8080' -H 'Origin: http://rasqberry.local:8080'
          expect 403 /api/contents  "cross-site page"            -H 'Host: localhost:8080'       -H 'Origin: https://evil.example'
          expect 403 /api/contents  "DNS rebinding"              -H 'Host: evil.example:8080'    -H 'Origin: http://evil.example:8080'
          expect 403 /api/terminals "cross-site terminal create" -H 'Host: localhost:8080'       -H 'Origin: https://evil.example'

          # Offline Pi (#964): thebelab (with its lazy chunks) and KaTeX come
          # from the site itself, and no page loads a CDN or analytics script.
          for path in /vendor/thebelab/index.js /vendor/thebelab/1.index.js \
                      /vendor/katex/katex.min.css /runtime-config.js; do
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            if [ "$got" = "200" ]; then echo "PASS: serves $path"; else echo "::error::$path: got $got"; fail=1; fi
          done
          if docker exec smoke grep -rlE 'src="https://(unpkg\.com|cloud\.umami\.is)|href="https://cdn\.jsdelivr\.net' \
               /usr/share/nginx/html --include=*.html | head -3 | grep .; then
            echo "::error::built pages still load a CDN or analytics script"; fail=1
          else echo "PASS: no CDN or analytics script in the built pages"; fi
          curl -s http://localhost:8080/runtime-config.js | grep -q 'labEnabled: true' \
            && echo "PASS: runtime-config default" || { echo "::error::runtime-config default"; fail=1; }

          docker rm -f smoke >/dev/null 2>&1 || true

          # Workshop switches (#963).
          docker run -d --name smoke2 -p 8081:80 -e JUPYTER_TOKEN=smoketoken1234 \
            -e LAB_ENABLED=false -e ALLOW_TERMINALS=false -e CULL_IDLE_TIMEOUT=1800 \
            doqumentation-jupyter:smoke
          for i in $(seq 1 45); do
            curl -fsS -o /dev/null http://localhost:8081/ && break; sleep 2
          done
          curl -s http://localhost:8081/runtime-config.js | grep -q 'labEnabled: false' \
            && echo "PASS: LAB_ENABLED=false reaches the site" || { echo "::error::LAB_ENABLED"; fail=1; }
          for path in /terminals/websocket/1 /api/terminals; do
            got=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8081$path" \
              -H 'Host: localhost:8081' -H 'Origin: http://localhost:8081')
            if [ "$got" = "403" ]; then echo "PASS: ALLOW_TERMINALS=false blocks $path"; else echo "::error::$path: got $got, want 403"; fail=1; fi
          done
          docker exec smoke2 grep -q 'cull_idle_timeout = 1800' /home/jovyan/.jupyter/jupyter_server_config.py \
            && echo "PASS: CULL_IDLE_TIMEOUT" || { echo "::error::CULL_IDLE_TIMEOUT"; fail=1; }
          docker exec smoke2 sh -c 'test -w "$MPLCONFIGDIR"' \
            && echo "PASS: MPLCONFIGDIR writable" || { echo "::error::MPLCONFIGDIR not writable"; fail=1; }
          docker rm -f smoke2 >/dev/null 2>&1 || true
          if docker run --rm -e LAB_ENABLED=maybe doqumentation-jupyter:smoke >/dev/null 2>&1; then
            echo "::error::an invalid LAB_ENABLED was accepted"; fail=1
          else echo "PASS: invalid LAB_ENABLED refused"; fi

          [ "$fail" = "0" ] || exit 1
