name: Build locales (PR)

# CI builds EN only, and the all-locale build lives in deploy-locales.yml, which
# runs on push to main and *deploys* as it goes. So a change that breaks MDX in a
# translation is not caught until after it is merged and published — the EN build
# cannot see locale content at all.
#
# This closes that gap: the same build steps as deploy-locales.yml, minus the
# encrypt and deploy steps, run on the PR. Nothing is published.
#
# Scoped to the locales the PR actually touches, so a normal review round builds
# 3-5 locales rather than 26. A corpus-wide change builds all 17 main locales in
# parallel — minutes of wall clock instead of hours, and no local disk cost
# (a full local sweep needs ~6 GB of webpack cache per locale).

on:
  pull_request:
    paths:
      - 'i18n/**'
      - 'docs/**'
      - 'src/**'
      - 'translation/v2/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - '.github/workflows/build-locales-pr.yml'
      - '.github/actions/setup-po4a/**'
  workflow_dispatch:
    inputs:
      locales:
        description: 'JSON array of locales, e.g. ["it","ar"]. Empty = all main locales.'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-locales-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-locales:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.pick.outputs.locales }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide which locales to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The 9 German dialects are deliberately unmaintained and excluded from
          # every gate, so they are never built here either.
          MAIN='["ar","cs","de","es","fr","he","id","it","ja","ko","ms","pl","pt","ro","th","tl","uk"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IN='${{ github.event.inputs.locales }}'
            LOCALES="${IN:-$MAIN}"
          else
            # Files come from the PR API, not `git diff`: checkout is shallow and
            # a base..HEAD diff would need fetch-depth: 0.
            # `gh pr view --json files` returns at most 100 files. A PR that
            # adds thousands (a locale bootstrap) then looks like it touches
            # only the first locale alphabetically, and only that one builds.
            # The REST endpoint paginates.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
               -q '.[].filename' > files.txt

            # A change to shared content, site code or the renderer can break
            # every locale, so build them all in that case. Only those paths
            # force a full matrix — an earlier version forced it for anything
            # outside i18n/, which meant every review-round PR built all 17
            # locales purely because it also writes translation/status.json.
            # status.json and the review scripts cannot affect a locale build.
            if grep -qE '^(docs/|src/|translation/v2/|docusaurus\.config\.ts|sidebars\.ts|package(-lock)?\.json|\.github/workflows/build-locales-pr\.yml|\.github/actions/setup-po4a/)' files.txt; then
              LOCALES="$MAIN"
            else
              # $MAIN must interpolate but $l must NOT — it is a jq binding.
              # Unescaped inside double quotes, bash expanded it and `set -u`
              # aborted the job with "l: unbound variable". This line had never
              # run before: every earlier PR took the build-everything branch,
              # so tightening that branch is what first made it reachable.
              LOCALES=$(sed -n 's|^i18n/\([a-z][a-z]*\)/.*|\1|p' files.txt \
                        | sort -u \
                        | jq -R . | jq -sc "map(select(. as \$l | $MAIN | index(\$l)))")
              # No i18n/ files and nothing build-affecting: nothing to verify.
              [ "$LOCALES" = "[]" ] && LOCALES="[]"
            fi
          fi
          echo "locales=$LOCALES" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$LOCALES" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Building: $LOCALES"

  build:
    needs: pick-locales
    if: needs.pick-locales.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      # One broken locale must not cancel the others — the whole point is to
      # learn which locales break, not just that one did.
      fail-fast: false
      matrix:
        locale: ${{ fromJson(needs.pick-locales.outputs.locales) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Same preparation as deploy-locales.yml — a locale build needs docs/
      # synced, pages rendered from the PO files, fallbacks populated and
      # notebooks generated, or it fails for reasons unrelated to the change
      # under review. Only main locales build here, so po4a is always needed.
      - name: Sync upstream content
        run: python3 scripts/sync-content.py --no-clone

      - name: Set up po4a
        uses: ./.github/actions/setup-po4a

      - name: Render locale from PO files
        run: python3 translation/v2/render.py --locale ${{ matrix.locale }}

      - name: Populate locale fallbacks
        run: python3 translation/scripts/translate-content.py populate-locale --locale ${{ matrix.locale }}

      - name: Generate translated notebooks
        run: python3 scripts/sync-content.py --no-clone --generate-locale-notebooks --locale ${{ matrix.locale }}

      - name: Install dependencies
        run: npm ci

      # No encrypt step and no deploy step: this verifies, it never publishes.
      - name: Build locale site
        run: npx docusaurus build --locale ${{ matrix.locale }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          DQ_LOCALE_URL: 'https://${{ matrix.locale }}.doqumentation.org'
