name: Check Translation Freshness

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:

# Least-privilege baseline; the job escalates to contents+issues write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync upstream content
        run: python3 scripts/sync-content.py --no-clone

      - name: Set up po4a
        uses: ./.github/actions/setup-po4a

      # The rendered pages are not in git: everything below that reads
      # i18n/<locale>/…/current/ (lint, status, the contributor overview)
      # needs them rendered from the PO files first.
      - name: Render the maintained locales
        run: |
          for l in ar cs de es fr he id it ja ko ms pl pt ro th tl uk; do
            python3 translation/v2/render.py --locale "$l"
          done

      # Full corpus lint of the 17 MAINTAINED locales. Deliberately not
      # --all-locales: the 9 German dialects are kept but unmaintained and
      # hold 287 lint errors between them, so including them would make this
      # report ~100% noise and it would be ignored within a week.
      # The PR-time step in ci.yml only sees files that PR
      # touched, so it cannot catch a file that goes bad because EN changed
      # under it — which is exactly how a fence-count mismatch reached main.
      # ~15 min, which is fine once a day. Non-blocking: this workflow's job is
      # to report drift, not to gate, and a red daily run would mask the
      # staleness reporting below it.
      - name: Lint all maintained translations
        continue-on-error: true
        run: python3 translation/scripts/lint-translation.py --main-locales

      - name: Update translation status
        run: python3 translation/scripts/translation-status.py --write-status

      # Contributor-facing "what we need right now". Hand-written status rots:
      # CONTRIBUTING-REVIEWS.md told contributors (and their Claude agents)
      # "de is complete" long after de was reopened, and carried a pool table
      # from a threshold the project had already moved past. Regenerating here
      # keeps the recipe files free of numbers that go stale.
      - name: Refresh CONTRIBUTING-NOW.md
        run: python3 translation/scripts/contributing-status.py --write

      - name: Commit status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation/STATUS.md CONTRIBUTING-NOW.md
          # Group commit+push so they ONLY run when there are staged changes.
          # Without the braces, `||` and `&&` are equal-precedence/left-assoc, so
          # `diff --quiet || commit && push` runs `push` even on a clean tree
          # (empty diff → diff exits 0 → || short-circuits → && push still fires).
          if ! git diff --cached --quiet; then
            git commit -m "Update STATUS.md + CONTRIBUTING-NOW [ci skip]"
            git push
          fi

      # Staleness in v2 is a property of PO entries, not files: after an
      # English sync, msgmerge marks changed segments fuzzy and new ones
      # untranslated, and a new upstream page has no PO at all. This runs the
      # merge against the current English and reports the per-locale worklist,
      # then discards the merged POs — the merge is committed by the sync
      # procedure in translation/v2/README.md, not by a report.
      - name: Check for untranslated or fuzzy segments
        id: check
        run: |
          set +e
          python3 translation/v2/extract.py > /dev/null 2>&1
          : > staleness-report.txt
          for l in ar cs de es fr he id it ja ko ms pl pt ro th tl uk; do
            python3 translation/v2/update.py --locale "$l" 2>/dev/null | grep -E "^$l:" | tee -a staleness-report.txt
          done
          git checkout -- i18n translation/v2/pot
          rc=0
          if grep -vE ' 0 fuzzy, 0 untranslated .*; 0 page\(s\) without a PO' staleness-report.txt | grep -q .; then
            rc=1
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Create or update issue if stale
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('staleness-report.txt', 'utf8').trim();
            const title = 'Stale translations detected';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'translation-freshness',
            });
            const body = [
              '## Translation staleness report',
              '',
              'Per locale, after `msgmerge` against the current English:',
              'fuzzy = the English of that segment changed since it was translated,',
              'untranslated = a new segment, "without a PO" = a new upstream page.',
              '',
              '```',
              report,
              '```',
              '',
              'To fix, run the sync procedure in `translation/v2/README.md` for each',
              'locale listed (update → prepare → translate-locale workflow → apply →',
              'render → gates) and commit the PO files.',
              '',
              '_Auto-generated by check-translations workflow_',
            ].join('\n');
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
              console.log(`Updated issue #${issues.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['translation-freshness'],
              });
              console.log(`Created issue #${created.data.number}`);
            }
