name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by JanLahmann/Fun-with-Quantum when family/family.json changes → footer re-renders.
  repository_dispatch:
    types: [family-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Pillow + dav1d: the sync shrinks output images too wide for browsers.
      - name: Set up image tools
        uses: ./.github/actions/setup-image-tools

      # --no-clone: build from the upstream commit the submodule is PINNED to.
      # Without it sync-content.py runs `git submodule update --remote`, which
      # moved the checkout to upstream HEAD on every deploy: the live English
      # drifted daily while docs/ (what translations are validated against)
      # stayed at the last sync PR. The sync-upstream workflow is the only
      # place the pin advances.
      - name: Sync upstream content
        run: python3 scripts/sync-content.py --no-clone

      - name: Install dependencies
        run: npm ci

      - name: Encrypt admin URLs
        id: encrypt
        if: env.ADMIN_PASSWORD != '' && env.UMAMI_SHARE_URL != ''
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
        run: |
          BLOB=$(node scripts/encrypt-for-admin.mjs "$UMAMI_SHARE_URL")
          echo "umami_share=${BLOB}" >> "$GITHUB_OUTPUT"

      - name: Build site (English only)
        run: npx docusaurus build --locale en
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_ENCRYPTED_UMAMI_SHARE_URL: ${{ steps.encrypt.outputs.umami_share }}

      - name: Push notebooks to notebooks branch
        run: |
          TOKEN_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Clone existing notebooks branch (preserves locale subdirs from deploy-locales)
          git clone --depth 1 --branch notebooks "$TOKEN_URL" notebooks-repo 2>/dev/null || {
            mkdir notebooks-repo && cd notebooks-repo && git init && git checkout -b notebooks && cd ..
          }
          cd notebooks-repo

          # Remove EN content only (keep locale subdirs like de/, es/, etc.)
          for d in tutorials guides learning docs; do rm -rf "$d" 2>/dev/null; done

          # Copy fresh EN notebooks from build output
          cp -r ../build/notebooks/* .

          # Binder runs the QuBins image (src/config/jupyter.ts), not this
          # branch; drop the Binder config earlier deploys left here.
          rm -rf binder

          git add -A
          git diff --cached --quiet && echo "No notebook changes" && exit 0
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Update EN notebooks + Binder config from ${{ github.sha }}"
          git push --force "$TOKEN_URL" notebooks

      - name: Push English-only notebooks to notebooks-en branch
        # nbgitpuller source for "Open in JupyterLab" on the English site
        # (src/config/jupyter.ts getNotebookContentRepo). The `notebooks`
        # branch above also holds every locale's subdirectory (~3 GB, kept
        # for the Code Engine image); a Binder session must only clone the
        # reader's language, like the satellites' notebooks branches do.
        # Runs before the Pages deploy, so the branch exists when the new
        # site starts linking to it.
        run: |
          TOKEN_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Commit on top of the existing branch (linear history) so an
          # nbgitpuller clone in a running session can still fast-forward.
          git clone --depth 1 --branch notebooks-en "$TOKEN_URL" notebooks-en-repo 2>/dev/null || {
            mkdir notebooks-en-repo && cd notebooks-en-repo && git init -b notebooks-en && cd ..
          }
          cd notebooks-en-repo

          # Replace the whole tree with the fresh English build output.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../build/notebooks/* .

          git add -A
          git diff --cached --quiet && echo "No notebook changes" && exit 0
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Update EN notebooks from ${{ github.sha }}"
          git push "$TOKEN_URL" notebooks-en

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
