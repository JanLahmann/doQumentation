name: Site bug
description: Something on doqumentation.org is broken (layout, links, search, settings, progress), in any language.
title: "Site: <short description>"
labels: ["site-bug"]
body:
  - type: markdown
    attributes:
      value: |
        For mistakes in the tutorial or course **content itself** (typos, technical errors in the English),
        please report upstream at [Qiskit/documentation](https://github.com/Qiskit/documentation/issues):
        doQumentation mirrors that content and does not edit it.
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Firefox 140 on Windows, Safari on iPhone"
