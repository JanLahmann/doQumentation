name: Claim a locale
description: Announce that you are working on one locale, so nobody else picks it up.
title: "claim: <locale> (<review|translate>)"
labels: ["translation-claim"]
body:
  - type: markdown
    attributes:
      value: |
        One open issue per claim. Close it when you stop, even if you did not finish.
        The current claims are listed in [CONTRIBUTING-NOW.md](../blob/main/CONTRIBUTING-NOW.md)
        and by `gh issue list --label translation-claim`.
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options: [ar, cs, de, es, fr, he, id, it, ja, ko, ms, pl, pt, ro, th, tl, uk]
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: What you will do
      options:
        - review (CONTRIBUTING-REVIEWS.md)
        - translate (CONTRIBUTING-TRANSLATIONS.md)
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Rough scope
      placeholder: "e.g. one review round of ~25 files this week"
