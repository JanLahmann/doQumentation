name: Code does not run
description: A code cell on doqumentation.org fails although you ran the cells above it in order.
title: "Execution error on <page>"
labels: ["execution-error"]
body:
  - type: markdown
    attributes:
      value: |
        The "Report this error" link under a failed cell fills most of this in for you.
        Some pages need an IBM Quantum account or IBM Quantum Premium (Qiskit Functions); those cells
        say so when they run and are not bugs.
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      render: text
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Cell code (if you changed it)
      render: python
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - doqumentation.org (Binder)
        - Docker / Podman image
        - RasQberry
        - Workshop server
        - Other
