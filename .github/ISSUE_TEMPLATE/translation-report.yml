name: Wrong or awkward translation
description: A sentence on a translated page is wrong, missing, or reads badly. No tools needed.
title: "[<locale>] Translation: <page>"
labels: ["translation-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports from fluent readers are the most valuable help this project gets.
        One issue per page is fine; list several sentences in it.
  - type: dropdown
    id: locale
    attributes:
      label: Language
      options: [ar, cs, de, es, fr, he, id, it, ja, ko, ms, pl, pt, ro, th, tl, uk]
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: "https://de.doqumentation.org/tutorials/grovers-algorithm"
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: The sentence as it reads now
      description: Copy it from the page.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say (if you know)
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Wrong meaning
        - Wrong or inconsistent technical term
        - Missing text (part of the English is not translated)
        - Grammar or style
        - Left in English
        - Other
