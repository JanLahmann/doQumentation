name: Push to main
description: >
  Push the current HEAD to main. main is protected by a ruleset that only a
  repository admin or a deploy key may bypass, and GITHUB_TOKEN is neither, so
  a bot commit straight to main goes through the MAIN_DEPLOY_KEY deploy key.
  Without the key it falls back to a plain `git push`, which works only while
  main has no ruleset.

inputs:
  deploy-key:
    description: 'Private half of a deploy key with write access (secrets.MAIN_DEPLOY_KEY). Empty = plain git push.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        set -euo pipefail
        if [ -z "$DEPLOY_KEY" ]; then
          echo "MAIN_DEPLOY_KEY is not set; pushing with the checkout token."
          git push
          exit 0
        fi
        # Only this push uses the key: the checkout (and its submodules) keep
        # the token, since a deploy key opens this repository and no other.
        KEY="$RUNNER_TEMP/main_deploy_key"
        install -m 600 /dev/null "$KEY"
        printf '%s\n' "$DEPLOY_KEY" > "$KEY"
        mkdir -p ~/.ssh
        ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
        GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes" \
          git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
        rm -f "$KEY"
