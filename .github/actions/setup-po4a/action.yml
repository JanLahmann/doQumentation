name: Set up po4a
description: >
  Install the tools translation/v2 needs to render a locale from its PO files:
  GNU gettext (msgmerge, msgattrib), po4a >= 0.74 and the polib package.
  Ubuntu's po4a package is 0.69 and its Markdown parser segments differently,
  so po4a comes from the upstream release tarball (it is pure Perl and runs
  in place) and is put on PATH ahead of the apt version.

inputs:
  po4a-version:
    description: po4a release to install
    required: false
    default: "0.74"

runs:
  using: composite
  steps:
    # apt's po4a (0.69) is installed only for its Perl dependencies (Locale::gettext,
    # Unicode::LineBreak, YAML::Tiny, SGMLS, Pod::Parser, …); the 0.74 wrappers
    # below shadow its binaries.
    - name: Install gettext, po4a's dependencies and polib
      shell: bash
      run: |
        # The runner image ships third-party apt sources we never use (Google
        # Chrome, Microsoft Edge, …). On 2026-09-09 a hash-sum mismatch on
        # dl.google.com made `apt-get update` exit 100 and failed all 17 locale
        # builds plus typecheck-and-build at once, with nothing wrong in the
        # branch. Drop those sources first, and never let an index refresh
        # failure alone abort the step: apt keeps the old lists, and the
        # install below is still strict.
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                   /etc/apt/sources.list.d/microsoft-edge*.list \
                   /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -qq || echo "::warning::apt-get update failed; installing from the cached package lists"
        sudo apt-get install -y -qq gettext po4a
        python3 -m pip install --quiet polib

    - name: Install po4a ${{ inputs.po4a-version }} from the release tarball
      shell: bash
      run: |
        set -euo pipefail
        V="${{ inputs.po4a-version }}"
        DEST="$RUNNER_TEMP/po4a-$V"
        curl -sSL -o "$RUNNER_TEMP/po4a.tar.gz" \
          "https://github.com/mquinson/po4a/releases/download/v$V/po4a-$V.tar.gz"
        mkdir -p "$DEST" && tar xzf "$RUNNER_TEMP/po4a.tar.gz" -C "$DEST" --strip-components=1
        mkdir -p "$RUNNER_TEMP/po4a-bin"
        for t in po4a po4a-gettextize po4a-translate po4a-updatepo po4a-normalize; do
          printf '#!/bin/sh\nexport PERL5LIB=%s/lib\nexec perl %s/%s "$@"\n' "$DEST" "$DEST" "$t" > "$RUNNER_TEMP/po4a-bin/$t"
          chmod +x "$RUNNER_TEMP/po4a-bin/$t"
        done
        echo "$RUNNER_TEMP/po4a-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/po4a-bin/po4a" --version
