name: Set up image tools
description: >
  Install what scripts/downscale-wide-images.py (run by sync-content.py) needs
  to shrink output images too wide for browsers to decode: Pillow >= 11.3
  (AVIF encoder and decoder built into the wheels) and the dav1d CLI, which
  decodes the AVIFs libavif refuses (wider than 32,768 px). Without them the
  sync still works and leaves those images as they are.

runs:
  using: composite
  steps:
    - name: Install Pillow and dav1d
      shell: bash
      run: |
        # Same apt hardening as setup-po4a: drop third-party sources we never
        # use and do not let an index refresh failure alone abort the step.
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                   /etc/apt/sources.list.d/microsoft-edge*.list \
                   /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -qq || echo "::warning::apt-get update failed; installing from the cached package lists"
        sudo apt-get install -y -qq dav1d
        python3 -m pip install --quiet "pillow>=11.3"
