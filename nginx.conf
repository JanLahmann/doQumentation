# ── Who may reach Jupyter through this proxy ──
# The proxy adds the Jupyter token to every request (docker-entrypoint.sh),
# and jupyter_server skips its own Origin check for token-authenticated
# requests, so ServerApp.allow_origin never applies here. This file does the
# check instead. A request to /api/ or /terminals/ is forwarded only when
#   - its Origin is absent or is this site itself, and the Host is a LAN name
#     (loopback/private/link-local IPv4, a .local name or a single label), or
#   - its Origin is listed in CORS_ORIGIN (filled in by the entrypoint).
# Same-origin covers every address a classroom Pi is reached by, with no
# configuration. The LAN-Host condition keeps a DNS-rebinding page (Host
# evil.example resolving to this machine) out; a cross-site page is out
# because its Origin is neither this site nor listed. WebSockets carry an
# Origin too, so kernel and terminal channels get the same check.
map $host $dq_lan_host {
    default 0;
    "~^(?:localhost|127(?:\.\d{1,3}){3}|10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|169\.254(?:\.\d{1,3}){2}|[a-z0-9-]+(?:\.[a-z0-9-]+)*\.local|[a-z0-9-]+)$" 1;
}

map "$http_origin|$scheme://$http_host" $dq_same_origin {
    default 0;
    "~^\|" 1;
    "~^([^|]+)\|\1$" 1;
}

map $http_origin $dq_origin_listed {
    default 0;
    # __CORS_ORIGIN_MAP__
}

map "$dq_same_origin$dq_lan_host$dq_origin_listed" $dq_jupyter_allowed {
    default 0;
    "~^11" 1;
    "~1$" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Jupyter API reverse proxy (used by Dockerfile.jupyter)
    location /api/ {
        if ($dq_jupyter_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # __JUPYTER_AUTH__
        proxy_buffering off;
    }

    # __TERMINALS_BEGIN__ (docker-entrypoint.sh drops this block when ALLOW_TERMINALS=false)
    location /terminals/ {
        if ($dq_jupyter_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # __JUPYTER_AUTH__
        proxy_buffering off;
    }
    # __TERMINALS_END__

    # Runtime settings for the site (LAB_ENABLED=...), written by
    # docker-entrypoint.sh; overrides the build's empty default.
    location = /runtime-config.js {
        alias /tmp/nginx/runtime-config.js;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Docusaurus writes each page as <path>.html (trailingSlash: false), so
    # try that before the directory: without it every deep link got the home
    # page's HTML and React rebuilt the page in the browser (hydration error
    # #418, home-page title until the script ran, nothing without JavaScript).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
